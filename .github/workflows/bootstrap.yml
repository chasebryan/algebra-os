name: Bootstrap seed

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-seed:
    name: Build and audit UEFI seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate bootstrap source layout
        run: |
          test -f Makefile
          test -f boot/x86_64/uefi/seed.S
          test -f boot/x86_64/uefi/seed.ld
          test -f tools/audit-seed.sh
          sh -n tools/audit-seed.sh

      - name: Install bootstrap host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            binutils \
            build-essential \
            python3 \
            qemu-system-x86 \
            ovmf

      - name: Build, audit, and verify reproducibility
        run: |
          make check
          mkdir -p build/boot-evidence
          dpkg-query -W binutils make python3 qemu-system-x86 ovmf > build/boot-evidence/host-packages.txt

      - name: Boot twice with fresh firmware variables
        run: |
          python3 -m unittest discover -s tools/tests -v
          make boot-check

      - name: Recover from a deliberately stale first map key
        run: make BUILD_DIR=build/stale-key ASFLAGS=--defsym=TEST_STALE_MAP_KEY=1 boot-check

      - name: Classify deliberately raised processor faults
        run: |
          make BUILD_DIR=build/fault-breakpoint ASFLAGS=--defsym=TEST_BREAKPOINT=1 BOOT_CHECK_FLAGS='--expect-fault 3 --expect-error 0' boot-check
          make BUILD_DIR=build/fault-divide ASFLAGS=--defsym=TEST_DIVIDE_ERROR=1 BOOT_CHECK_FLAGS='--expect-fault 0 --expect-error 0 --expect-register rax=1 --expect-register rcx=0 --expect-register rdx=0' boot-check
          make BUILD_DIR=build/fault-invalid-opcode ASFLAGS=--defsym=TEST_INVALID_OPCODE=1 BOOT_CHECK_FLAGS='--expect-fault 6 --expect-error 0' boot-check
          make BUILD_DIR=build/fault-general-protection ASFLAGS=--defsym=TEST_GENERAL_PROTECTION=1 BOOT_CHECK_FLAGS='--expect-fault 13 --expect-error 0xfff8' boot-check
          make BUILD_DIR=build/fault-page ASFLAGS=--defsym=TEST_PAGE_FAULT=1 BOOT_CHECK_FLAGS='--expect-fault 14 --expect-error 0 --expect-cr2 0x400000000000 --expect-register rax=0x400000000000' boot-check
          make BUILD_DIR=build/fault-double ASFLAGS=--defsym=TEST_DOUBLE_FAULT=1 BOOT_CHECK_FLAGS='--expect-fault 8 --expect-error 0 --expect-register rsp=0' boot-check

      - name: Publish seed image
        if: always() && hashFiles('build/esp/EFI/BOOT/BOOTX64.EFI') != ''
        uses: actions/upload-artifact@v4
        with:
          name: algebra-uefi-seed-${{ github.sha }}
          path: |
            build/esp/EFI/BOOT/BOOTX64.EFI
            build/boot-evidence/
            build/stale-key/esp/EFI/BOOT/BOOTX64.EFI
            build/stale-key/boot-evidence/
            build/fault-*/esp/EFI/BOOT/BOOTX64.EFI
            build/fault-*/boot-evidence/
          if-no-files-found: error
